# Approval-gate label definitions.
# Usage: github-label-sync --access-token <token> --labels labels.yml <owner>/<repo>
# or apply individually via: gh label create "<name>" --color "<color>" --description "<description>"

- name: "stage:requirements"
  color: "0E8A16"
  description: "Work item is with the Requirements Orchestrator"
- name: "stage:design"
  color: "0E8A16"
  description: "Work item is with the Design Orchestrator"
- name: "stage:architecture"
  color: "0E8A16"
  description: "Work item is with the Architecture Orchestrator"
- name: "stage:implementation"
  color: "0E8A16"
  description: "Work item is with the Implementation Orchestrator"
- name: "stage:test"
  color: "0E8A16"
  description: "Work item is with the Test Orchestrator"
- name: "stage:done"
  color: "0E8A16"
  description: "Work item merged/closed - terminal stage"

- name: "approved:requirements"
  color: "1D76DB"
  description: "Human approved Requirements draft - advance to Design"
- name: "approved:design"
  color: "1D76DB"
  description: "Human approved Design draft - advance to Architecture"
- name: "approved:architecture"
  color: "1D76DB"
  description: "Human approved Architecture draft - advance to Implementation"
- name: "approved:implementation"
  color: "1D76DB"
  description: "Human approved PR - advance to Test"
- name: "approved:test"
  color: "1D76DB"
  description: "Human approved test results - merge / stage:done"

- name: "changes-requested:requirements"
  color: "D93F0B"
  description: "Requirements draft rejected - orchestrator must redraft"
- name: "changes-requested:design"
  color: "D93F0B"
  description: "Design draft rejected - orchestrator must redraft"
- name: "changes-requested:architecture"
  color: "D93F0B"
  description: "Architecture draft rejected - orchestrator must redraft"
- name: "changes-requested:implementation"
  color: "D93F0B"
  description: "Implementation PR rejected - orchestrator must redraft"
- name: "changes-requested:test"
  color: "D93F0B"
  description: "Test results rejected - orchestrator must redraft"

- name: "in-progress:requirements"
  color: "FBCA04"
  description: "Requirements Orchestrator is actively drafting"
- name: "in-progress:design"
  color: "FBCA04"
  description: "Design Orchestrator is actively drafting"
- name: "in-progress:architecture"
  color: "FBCA04"
  description: "Architecture Orchestrator is actively drafting"
- name: "in-progress:implementation"
  color: "FBCA04"
  description: "Implementation Orchestrator is actively drafting"
- name: "in-progress:test"
  color: "FBCA04"
  description: "Test Orchestrator is actively drafting"

- name: "escalation:line-manager"
  color: "5319E7"
  description: "Line Manager flagged a capability-gap pattern for PM attention"

- name: "priority:high"
  color: "B60205"
  description: "High priority - Assignment Registry tiebreaker"
- name: "priority:medium"
  color: "E4E669"
  description: "Medium priority - Assignment Registry tiebreaker"
- name: "priority:low"
  color: "C2E0C6"
  description: "Low priority - Assignment Registry tiebreaker"
